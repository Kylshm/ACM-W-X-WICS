<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masondo Tours</title>
    <link rel="stylesheet" href="background-image.css">
    <link rel="icon" type="image/jpg" href="imagesfolder/masondo-favicon.jpg">
    <link href='https://cdn.boxicons.com/fonts/basic/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <!--sites for high resolution images:
        Unsplashed
        Pexels
        Pixabay
        For user icons go to: Boxicons.com
    
    -->
        
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username">
                <i class='bxr  bxs-user'  ></i> <!--style='color:#000000'-->

            </div>
            <div class="input-box">
                <input type="password" placeholder="Password">
                <i class='bxr  bxs-lock'  ></i> 
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? 
                   <a href="#">Register</a></p>
            </div>

        </form>
        
    </div>

    
</body>
</html>
